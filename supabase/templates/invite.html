<!DOCTYPE html>
<html lang="en">
  <body style="margin:0;padding:0;background:#000000;color:#ffffff;font-family:Segoe UI,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#000000;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#1a1a1a;border:1px solid #262626;border-radius:16px;padding:32px;">
            <tr>
              <td style="font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#a3a3a3;">Jordan Fitness</td>
            </tr>
            <tr>
              <td style="padding-top:12px;font-size:28px;font-weight:650;letter-spacing:-0.03em;">Jordan Pulse</td>
            </tr>
            <tr>
              <td style="padding-top:16px;font-size:16px;line-height:1.6;color:#ffffff;">
                You have been invited to Jordan Pulse. Choose a password to finish signing in. The link expires after a while, and it can be opened on any device.
              </td>
            </tr>
            <tr>
              <td style="padding-top:24px;">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=invite&amp;next=/account/password" style="display:inline-block;background:#ce0037;color:#ffffff;text-decoration:none;font-weight:650;border-radius:999px;padding:12px 20px;">
                  Accept invite
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding-top:24px;font-size:13px;line-height:1.5;color:#a3a3a3;">
                If you were not expecting this, you can ignore the email. Only @jordanfitness.com addresses can be invited.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
